; platformio.ini
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

upload_speed = 921600
upload_port = /dev/ttyUSB0

build_type = release
build_unflags = -Og -g -ggdb  
build_flags =
    -O3
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--relax  

lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

monitor_speed = 115200
monitor_filters = printable, send_on_enter, time


