; node-a: ESP32 DEV с OLED, светодиодом и кнопкой
[env:node_a]
platform = espressif32
board = esp32dev
framework = arduino

upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
monitor_filters = printable, send_on_enter, time

build_flags = -DNODE_A -I../common

lib_deps =
    nrf24/RF24 @ ^1.5.0
    adafruit/Adafruit GFX Library @ ^1.11.7
    adafruit/Adafruit SSD1306 @ ^2.5.13
