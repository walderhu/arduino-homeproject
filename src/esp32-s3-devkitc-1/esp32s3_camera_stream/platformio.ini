; platformio.ini
[env:esp32s3]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino

upload_speed = 921600
upload_port = /dev/ttyACM0
upload_flags =
    --after=hard_reset

board_build.partitions = huge_app.csv

build_unflags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    https://github.com/espressif/esp32-camera.git

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = printable, send_on_enter, time
