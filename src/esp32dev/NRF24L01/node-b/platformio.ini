; node-b: ESP32 DEV со светодиодом и кнопкой, без экрана
[env:node_b]
platform = espressif32
board = esp32dev
framework = arduino

upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
monitor_speed = 115200
monitor_filters = printable, send_on_enter, time

build_flags = -DNODE_B -I../common

lib_deps =
    nrf24/RF24 @ ^1.5.0
